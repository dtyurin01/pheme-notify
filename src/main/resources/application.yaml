spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: pheme-notify

  # ─── DataSource (PostgreSQL) ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_hub}
    username: ${DB_USER:pheme}
    password: ${DB_PASSWORD:pheme_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ─── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ─── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pheme-notify
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pheme.phemenotify.messaging.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ─── Mail (Mailpit) ─────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # ─── Thymeleaf ──────────────────────────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: ""
    cache: false

server:
  port: ${SERVER_PORT:8080}

# ─── Actuator & Metrics ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# ─── Notification ────────────────────────────────────────────────────────────
notification:
  rate-limit:
    email:
      max-requests: 5
      window-hours: 1
    sms:
      max-requests: 3
      window-hours: 1
    push:
      max-requests: 20
      window-hours: 1
  retry-scheduler:
    max-attempts: 3
    backoff-base-seconds: 300
    fixed-delay-ms: 60000

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.pheme.phemenotify: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
