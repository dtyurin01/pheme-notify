spring:
  flyway:
    enabled: true

  jpa:
    show-sql: true

  kafka:
    consumer:
      auto-offset-reset: earliest

logging:
  level:
    com.pheme.phemenotify: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: DEBUG
    com.github.dockerjava: WARN
    com.github.dockerjava.zerodep: DEBUG
